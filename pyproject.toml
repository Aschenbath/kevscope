[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kevscope"
version = "0.3.3"
description = "QNX kernel trace (.kev) analysis and Perfetto export"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
kevscope = "kevscope.cli:main"

[tool.setuptools]
packages = ["kevscope"]
